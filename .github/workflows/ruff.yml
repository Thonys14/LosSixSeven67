name: Validar calidad del código (Ruff)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          
      - name: Instalar Ruff
        run: pip install ruff
        
      - name: Ejecutar comprobación PEP 8
        run: ruff check .
